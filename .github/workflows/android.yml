name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: APK (Python ${{ matrix.py }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false        # si una version de Python falla, la otra sigue compilando
      matrix:
        py: ["3.11.5", "3.13.5"]
    env:
      NINJA_PY: ${{ matrix.py }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential python3-pip

      - name: Usar Java 17 para Gradle
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/temurin-17-jdk-amd64/bin" >> "$GITHUB_PATH"
          sudo update-alternatives --set java /usr/lib/jvm/temurin-17-jdk-amd64/bin/java || true
          java -version

      - name: Instalar Buildozer y Cython
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade buildozer "cython==0.29.36"

      - name: Cache de Buildozer (SDK y NDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-py${{ matrix.py }}-${{ hashFiles('buildozer.spec', 'p4a_recipes/**') }}-v3

      - name: Compilar el APK
        run: |
          yes | buildozer -v android debug

      - name: Guardar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ninja-mundo-apk-python-${{ matrix.py }}
          path: bin/*.apk
          if-no-files-found: error
